{{FrontSide}}

<hr class="divider">

<!-- ============================================ -->
<!-- 我的歷史錄音 (Recordings) - 可展開收合         -->
<!-- ============================================ -->
<div class="section recordings-section">
    <div class="section-title">🎙️ 我的歷史錄音 (My Recordings)</div>
    <div id="recordings-container"></div>
    <div id="recordings-empty" class="empty-hint" style="display:none;">尚無錄音紀錄</div>
</div>

<!-- ============================================ -->
<!-- 參考的範本回覆 (References)                    -->
<!-- ============================================ -->
<div class="section references-section">
    <div class="section-title">📝 參考範本回覆 (References)</div>
    <div id="references-container"></div>
    <div id="references-empty" class="empty-hint" style="display:none;">尚無範本</div>
</div>

<!-- 隱藏欄位供 JS 解析 (不含 [sound:] 語法，不會被 Anki 渲染器破壞) -->
<div id="recordings-data" style="display:none;">{{Recordings}}</div>
<div id="references-data" style="display:none;">{{References}}</div>

<script>
    (function () {
        // ============================
        // 翻面後隱藏正面的「文脈」區塊
        // ============================
        var ctxSections = document.querySelectorAll('.context-section');
        for (var i = 0; i < ctxSections.length; i++) {
            ctxSections[i].style.display = 'none';
        }

        // ============================
        // 工具函式
        // ============================
        function toggleAccordion(targetId, summaryEl) {
            var el = document.getElementById(targetId);
            if (!el) return;
            var isHidden = el.style.display === 'none';
            el.style.display = isHidden ? 'block' : 'none';
            var arrow = summaryEl.querySelector('.accordion-arrow');
            if (arrow) {
                arrow.textContent = isHidden ? '▾' : '▸';
            }
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        function safeParseJsonArray(elementId) {
            var el = document.getElementById(elementId);
            if (!el) return [];
            var raw = (el.textContent || '').trim();
            if (!raw) return [];
            try {
                var parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        // ============================
        // 解析與渲染歷史錄音
        // ============================
        var recordings = safeParseJsonArray('recordings-data');

        var recContainer = document.getElementById('recordings-container');
        var recEmpty = document.getElementById('recordings-empty');

        if (!recordings || recordings.length === 0) {
            recEmpty.style.display = 'block';
        } else {
            for (var i = 0; i < recordings.length; i++) {
                var r = recordings[i];
                var score = parseInt(r.score, 10) || 0;
                var dotClass = score >= 90 ? 'dot-green' : (score >= 60 ? 'dot-orange' : 'dot-red');
                var itemId = 'rec-detail-' + i;

                var item = document.createElement('div');
                item.className = 'accordion-item';

                // 摘要列 (點擊展開)
                var summary = document.createElement('div');
                summary.className = 'accordion-summary';
                summary.setAttribute('data-target', itemId);
                summary.innerHTML =
                    '<span class="status-dot ' + dotClass + '"></span>' +
                    '<span class="accordion-date">' + escapeHtml(r.date || '') + '</span>' +
                    '<span class="accordion-score">' + score + '</span>' +
                    '<span class="accordion-arrow">▸</span>';
                summary.onclick = (function (id) {
                    return function (e) {
                        e.stopPropagation();
                        e.preventDefault();
                        toggleAccordion(id, this);
                    };
                })(itemId);

                // 詳情區塊 (預設收合)
                var detail = document.createElement('div');
                detail.className = 'accordion-detail';
                detail.id = itemId;
                detail.style.display = 'none';

                // 音檔播放 (使用 HTML5 audio 元素，不依賴 Anki [sound:] 語法)
                if (r.audio) {
                    var audioRow = document.createElement('div');
                    audioRow.className = 'rec-audio';
                    var audioEl = document.createElement('audio');
                    audioEl.controls = true;
                    audioEl.preload = 'none';
                    audioEl.src = r.audio;
                    audioRow.appendChild(audioEl);
                    detail.appendChild(audioRow);
                }
                // 逐字稿
                if (r.transcript) {
                    var labelT = document.createElement('div');
                    labelT.className = 'rec-label';
                    labelT.textContent = '逐字稿';
                    detail.appendChild(labelT);
                    var transDiv = document.createElement('div');
                    transDiv.className = 'rec-transcript';
                    transDiv.textContent = r.transcript;
                    detail.appendChild(transDiv);
                }
                // AI 評語
                if (r.comment) {
                    var labelC = document.createElement('div');
                    labelC.className = 'rec-label';
                    labelC.textContent = 'AI 評語';
                    detail.appendChild(labelC);
                    var commentDiv = document.createElement('div');
                    commentDiv.className = 'rec-comment';
                    commentDiv.innerHTML = r.comment; // stt_diff 紅綠差異標記需要 HTML 渲染 / diff markup needs HTML rendering
                    detail.appendChild(commentDiv);
                }


                var tgBot = (document.getElementById('tg-bot-data') ? document.getElementById('tg-bot-data').textContent : '').trim();
                var cardId = (document.getElementById('card-id-data') ? document.getElementById('card-id-data').textContent : '').trim();
                if (tgBot && cardId) {
                    var delBtn = document.createElement('a');
                    delBtn.className = 'rec-delete-btn';
                    delBtn.style.display = 'block';
                    delBtn.style.marginTop = '10px';
                    delBtn.style.color = '#ff4444';
                    delBtn.style.textDecoration = 'none';
                    delBtn.style.fontSize = '0.9em';
                    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                    var tgBase = isMobile ? 'tg://resolve?domain=' : 'https://t.me/';
                    var tgParam = isMobile ? '&start=' : '?start=';
                    delBtn.href = tgBase + tgBot + tgParam + 'del-Recordings-' + i + '-' + encodeURIComponent(cardId);
                    delBtn.innerHTML = '🗑️ 刪除此錄音';
                    delBtn.onclick = function (e) { e.stopPropagation(); };
                    detail.appendChild(delBtn);
                }

                item.appendChild(summary);
                item.appendChild(detail);
                recContainer.appendChild(item);
            }
        }

        // 新增錄音的 TG 按鈕 (與折疊錄音項目同層級)
        var recTgBtn = typeof scCreateTgBtn === 'function' ? scCreateTgBtn('rec', 'Recordings', 'last') : null;
        if (recTgBtn) {
            recTgBtn.className = 'rec-submit-btn';
            recTgBtn.innerHTML = '<span class="rec-submit-icon">🎤</span><span class="rec-submit-text">提交新錄音</span>';
            recContainer.appendChild(recTgBtn);
        }

        // ============================
        // 解析與渲染參考範本 (含語音頭像)
        // ============================
        var references = safeParseJsonArray('references-data');

        var refContainer = document.getElementById('references-container');
        var refEmpty = document.getElementById('references-empty');

        if (!references || references.length === 0) {
            refEmpty.style.display = 'block';
        } else {
            for (var i = 0; i < references.length; i++) {
                var ref = references[i];
                var statusVal = parseInt(ref.status, 10);
                var statusDot = statusVal === 1 ? 'dot-green' : 'dot-red';

                var refItem = document.createElement('div');
                refItem.className = 'ref-item';
                refItem.setAttribute('data-index', i);
                refItem.setAttribute('data-status', statusVal);
                if (statusVal === 0) { refItem.classList.add('ref-disabled'); }

                // Header: 狀態圓點 + 日期
                var header = document.createElement('div');
                header.className = 'ref-header';
                header.innerHTML =
                    '<span class="status-dot ' + statusDot + '"></span>' +
                    '<span class="ref-date">' + escapeHtml(ref.date || '') + '</span>';
                refItem.appendChild(header);

                // 內容
                var content = document.createElement('div');
                content.className = 'ref-content';
                content.textContent = ref.content || '';
                refItem.appendChild(content);

                // 語音頭像列
                var refAudios = ref.audios || [];
                if (refAudios.length > 0 || (document.getElementById('tg-bot-data') && document.getElementById('tg-bot-data').textContent.trim())) {
                    var avatarRow = document.createElement('div');
                    avatarRow.className = 'avatar-row';

                    for (var j = 0; j < refAudios.length; j++) {
                        avatarRow.appendChild(typeof scCreateAvatarBtn === 'function' ? scCreateAvatarBtn(refAudios[j], j) : null);
                    }

                    if (typeof scCreateTgBtn === 'function') {
                        var tgBtn = scCreateTgBtn('addaudio', 'References', i, '＋', '透過 Telegram 上傳現成語音');
                        var ttsBtn = scCreateTgBtn('ttsaudio', 'References', i, 'AI', '透過 AI TTS 生成語音');

                        if (tgBtn) avatarRow.appendChild(tgBtn);
                        if (ttsBtn) avatarRow.appendChild(ttsBtn);
                    }

                    refItem.appendChild(avatarRow);
                }

                refContainer.appendChild(refItem);
            }
        }
        // ============================
        // ============================
        // 檢查 AnkiConnect 狀態並綁定點擊事件 (僅限電腦端本地調用)
        // ============================
        var cardId = (document.getElementById('card-id-data') ? document.getElementById('card-id-data').textContent : '').trim();
        if (cardId) {
            // 1. 準備全域變數來記錄狀態，避免頻繁寫入資料庫導致 Anki 畫面強制刷新
            window._scModifications = false;
            window._scNoteId = null;
            window._scCurrentRefs = safeParseJsonArray('references-data');

            fetch('http://127.0.0.1:8765', {
                method: 'POST',
                body: JSON.stringify({ action: 'findNotes', version: 6, params: { query: 'Card_ID:' + cardId } })
            }).then(function (res) {
                return res.json();
            }).then(function (findData) {
                if (findData.result && findData.result.length > 0) {
                    window._scNoteId = findData.result[0];

                    // AnkiConnect 可用，啟用所有 ref-item 的點擊狀態切換
                    var refItems = document.querySelectorAll('.ref-item');
                    for (var k = 0; k < refItems.length; k++) {
                        (function (itemEl) {
                            itemEl.style.cursor = 'pointer';
                            itemEl.onclick = function (e) {
                                e.stopPropagation();
                                e.preventDefault();

                                var index = parseInt(itemEl.getAttribute('data-index'), 10);
                                var currentStatus = window._scCurrentRefs[index].status;
                                var newStatus = currentStatus === 1 ? 0 : 1;

                                // Optimistic UI Update (僅改畫面，不立刻寫入資料庫)
                                if (newStatus === 1) {
                                    itemEl.classList.remove('ref-disabled');
                                    var dot = itemEl.querySelector('.status-dot');
                                    if (dot) { dot.classList.remove('dot-red'); dot.classList.add('dot-green'); }
                                } else {
                                    itemEl.classList.add('ref-disabled');
                                    var dot = itemEl.querySelector('.status-dot');
                                    if (dot) { dot.classList.remove('dot-green'); dot.classList.add('dot-red'); }
                                }

                                // 記錄修改，等待離開卡片時再統一存檔
                                window._scCurrentRefs[index].status = newStatus;
                                window._scModifications = true;
                            };
                        })(refItems[k]);
                    }
                }
            }).catch(function (e) {
                console.log("AnkiConnect 未執行或在手機端，關閉狀態切換功能。");
            });

            // 2. 當離開卡片時 (切換下一張卡片或關閉視窗)，再一次性把結果存回 Anki
            // 這樣可以避免呼叫 updateNoteFields 造成的「畫面強制跳回正面」體驗問題
            window.addEventListener('beforeunload', function () {
                if (window._scModifications && window._scNoteId) {
                    var newJson = JSON.stringify(window._scCurrentRefs);
                    var payload = JSON.stringify({
                        action: 'updateNoteFields',
                        version: 6,
                        params: { note: { id: window._scNoteId, fields: { "References": newJson } } }
                    });

                    // 使用 sendBeacon 確保在網頁卸載時能在背景可靠地發送請求
                    if (navigator.sendBeacon) {
                        navigator.sendBeacon('http://127.0.0.1:8765', payload);
                    } else {
                        var xhr = new XMLHttpRequest();
                        xhr.open('POST', 'http://127.0.0.1:8765', false); // 同步請求作為最後手段
                        xhr.send(payload);
                    }
                }
            });

            // 3. 攔截所有跳轉至 Telegram 的連結，確保跳轉前強制存檔 (防止資料遺失)
            document.body.addEventListener('click', function (e) {
                var target = e.target;
                while (target && target.tagName !== 'A') {
                    target = target.parentElement;
                }
                if (target && (target.href.indexOf('t.me') > -1 || target.href.indexOf('tg://') > -1)) {
                    if (window._scModifications && window._scNoteId) {
                        e.preventDefault(); // 阻擋預設跳轉
                        e.stopPropagation();

                        var newJson = JSON.stringify(window._scCurrentRefs);
                        var payload = JSON.stringify({
                            action: 'updateNoteFields',
                            version: 6,
                            params: { note: { id: window._scNoteId, fields: { "References": newJson } } }
                        });

                        // 同步寫入確保資料庫更新完成
                        var xhr = new XMLHttpRequest();
                        xhr.open('POST', 'http://127.0.0.1:8765', false);
                        try { xhr.send(payload); } catch (err) { console.error(err); }

                        window._scModifications = false; // 已存檔

                        // 存檔完成後手動跳轉
                        window.location.href = target.href;
                    }
                }
            }, true); // 使用 Capture 階段攔截
        }
    })();
</script>
