<!-- 人脈卡「見面前複習」正面：稱呼與頭像，回想上次聊了什麼、這次要問什麼。每個人都有這張卡。
     多數人沒有照片：沒有照片時頭像是稱呼的第一個字，背景色由稱呼算出固定的顏色（與背面相同）。
     版面與「認人」正面相同（標籤 → 頭像 → 內容 → 問題），只有內容不同。 -->
<div class="card person-card person-front">
    <div class="front-kicker">見面前複習</div>

    {{#Photo}}<div class="avatar-lg">{{Photo}}</div>{{/Photo}}
    {{^Photo}}<div class="avatar-lg avatar-initial" id="review-avatar-initial"></div>{{/Photo}}

    <div class="front-name" id="review-name">{{Display_Name}}</div>
    <div class="front-sub" id="review-work" style="display:none;"></div>
    <div id="review-company" style="display:none;">{{Company}}</div>

    <div class="front-question">上次聊了什麼？這次要問什麼？</div>
</div>

<script>
    (function () {
        var avatar = document.getElementById('review-avatar-initial');
        if (!avatar) return;
        var name = (document.getElementById('review-name').textContent || '').trim();
        // 與背面的 avatarColor 相同：同一個人的頭像顏色在正反面一致
        var hash = 0;
        for (var i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) % 360;
        avatar.style.backgroundColor = 'hsl(' + hash + ', 45%, 32%)';
        avatar.textContent = name ? name.charAt(0) : '?';
    })();

    (function () {
        // 職位（Company）是 JSON 清單：只顯示現職（沒有離職年月、沒有劃掉，與背面的 isActiveEntry 相同）；
        // 沒有現職就不顯示（複習看現況，與「認人」不同）；還沒轉換的舊文字照原文顯示。
        // 在卡面隱藏的（hidden: true）蓋上遮擋，點一下才看得到（與背面的 coverIfHidden 相同）
        var raw = (document.getElementById('review-company').textContent || '').trim();
        if (!raw) return;
        var work = document.getElementById('review-work');
        var items = null;
        try {
            items = JSON.parse(raw);
        } catch (e) {
            work.textContent = raw;
            work.style.display = '';
            return;
        }
        if (Object.prototype.toString.call(items) !== '[object Array]') items = [];
        var shown = 0;
        items.forEach(function (p) {
            if (!p || typeof p !== 'object' || String(p.ended || '').trim() || String(p.end || '').trim()) return;
            var text = [p.company, p.title].map(function (s) { return String(s || '').trim(); }).filter(Boolean).join('・');
            if (!text) return;
            if (shown++ > 0) work.appendChild(document.createTextNode('／'));
            var span = document.createElement('span');
            span.textContent = text;
            if (p.hidden === true) {
                span.className = 'is-hidden';
                var c = document.createElement('span');
                c.className = 'hidden-cover';
                c.textContent = '隱藏';
                span.appendChild(c);
                span.addEventListener('click', function (e) {
                    if (span.className.indexOf('is-revealed') >= 0) return;
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    span.className += ' is-revealed';
                }, true);
            }
            work.appendChild(span);
        });
        work.style.display = shown ? '' : 'none';
    })();
</script>
