<!-- 人脈卡「認人」正面：只用線索出題（照片、職位、認識場合、外貌），問「這是誰？」。
     Anki 只要正面引用的欄位有一個有值就產生這張卡，所以這裡只能引用線索欄位、不能引用姓名：
     引用姓名會讓每個人都產生這張卡，也可能直接洩漏答案。多數人沒有照片，文字線索是主要的題目。
     職位（Company）是 JSON 清單：顯示目前有效的；都劃掉了就顯示清單最後一筆（通常是最後新增的）並標「以前」
     （認人仍是線索）；還沒轉換的舊文字照原文顯示。Title 已停用，正面不要引用（引用會讓沒有職位的人也產生這張卡）。
     版面與「見面前複習」正面相同（標籤 → 頭像 → 內容 → 問題），只有內容不同。 -->
<div class="card person-card person-front">
    <div class="front-kicker">認人</div>

    {{#Photo}}<div class="avatar-lg avatar-photo-cue">{{Photo}}</div>{{/Photo}}
    {{^Photo}}<div class="avatar-lg avatar-unknown">?</div>{{/Photo}}

    <dl class="cue-list">
        {{#Company}}<div class="cue" id="cue-work"><dt>職位</dt><dd id="cue-work-text"></dd></div>{{/Company}}
        {{#Met_Where}}<div class="cue"><dt>認識</dt><dd>{{Met_Where}}{{#Met_Date}}（{{Met_Date}}）{{/Met_Date}}</dd></div>{{/Met_Where}}
        {{#Appearance}}<div class="cue"><dt>外貌</dt><dd>{{Appearance}}</dd></div>{{/Appearance}}
    </dl>

    <div class="front-question">這是誰？</div>
</div>

<div id="front-company" style="display:none;">{{Company}}</div>
<script>
    (function () {
        var cue = document.getElementById('cue-work');
        if (!cue) return;
        // 與背面的 entryText 相同：職位是「公司・職稱」；格式壞掉時直接顯示原文
        var raw = (document.getElementById('front-company').textContent || '').trim();
        var text = '';
        var items = null;
        try {
            items = JSON.parse(raw);
        } catch (e) {
            text = raw;  // 還沒轉換的舊文字：照原文當線索
        }
        if (items !== null && Object.prototype.toString.call(items) !== '[object Array]') items = [];
        if (items) {
            var texts = function (list) {
                return list.map(function (p) {
                    return [p && p.company, p && p.title].map(function (s) { return String(s || '').trim(); })
                        .filter(Boolean).join('・');
                }).filter(Boolean);
            };
            var current = texts(items.filter(function (p) { return p && !String(p.ended || '').trim(); }));
            if (current.length) text = current.join('／');
            else if (items.length) text = (texts(items).pop() || '') + '（以前）';
        }
        if (text && text !== '（以前）') document.getElementById('cue-work-text').textContent = text;
        else cue.parentNode.removeChild(cue);
    })();
</script>
