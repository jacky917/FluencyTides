<!-- 人脈卡「認人」正面：只用線索出題（照片、職位、認識場合、外貌），問「這是誰？」。
     Anki 只要正面引用的欄位有一個有值就產生這張卡，所以這裡只能引用線索欄位、不能引用姓名：
     引用姓名會讓每個人都產生這張卡，也可能直接洩漏答案。多數人沒有照片，文字線索是主要的題目。
     職位（Company）是 JSON 清單：顯示現職（沒有離職年月、沒有劃掉，與背面的 isActiveEntry 相同）；沒有現職就顯示
     清單最後一筆（照網頁上排的順序）並標「以前」（認人仍是線索）；還沒轉換的舊文字照原文顯示，其他格式問題只在
     背面標出。
     Title 已停用，正面不要引用（引用會讓沒有職位的人也產生這張卡）。
     在卡面隱藏的（職位有 hidden: true；認識場合、認識日期、外貌有「人脈卡隱藏::欄位名」標籤）各自蓋上遮擋，
     點一下才看得到（遮擋的寫法與背面的 coverIfHidden 相同）。
     版面與「見面前複習」正面相同（標籤 → 頭像 → 內容 → 問題），只有內容不同。 -->
<div class="card person-card person-front">
    <div class="front-kicker">認人</div>

    {{#Photo}}<div class="avatar-lg avatar-photo-cue">{{Photo}}</div>{{/Photo}}
    {{^Photo}}<div class="avatar-lg avatar-unknown">?</div>{{/Photo}}

    <dl class="cue-list">
        {{#Company}}<div class="cue" id="cue-work"><dt>職位</dt><dd id="cue-work-text"></dd></div>{{/Company}}
        {{#Met_Where}}<div class="cue"><dt>認識</dt><dd><span id="cue-Met_Where">{{Met_Where}}</span>{{#Met_Date}}<span id="cue-Met_Date">（{{Met_Date}}）</span>{{/Met_Date}}</dd></div>{{/Met_Where}}
        {{#Appearance}}<div class="cue"><dt>外貌</dt><dd id="cue-Appearance">{{Appearance}}</dd></div>{{/Appearance}}
    </dl>

    <div class="front-question">這是誰？</div>
</div>

<div id="front-company" style="display:none;">{{Company}}</div>
<div id="front-tags" style="display:none;">{{Tags}}</div>
<script>
    (function () {
        // 與背面的 coverIfHidden 相同：不透明的遮擋蓋在內容上，點一下掀開
        function cover(node, label) {
            node.className += ' is-hidden';
            var c = document.createElement('span');
            c.className = 'hidden-cover';
            c.textContent = label || '已隱藏・點一下看';
            node.appendChild(c);
            node.addEventListener('click', function (e) {
                if (node.className.indexOf('is-revealed') >= 0) return;
                e.preventDefault();
                e.stopImmediatePropagation();
                node.className += ' is-revealed';
            }, true);
        }

        var tags = (document.getElementById('front-tags').textContent || '').split(/\s+/);
        ['Met_Where', 'Met_Date', 'Appearance'].forEach(function (field) {
            var node = document.getElementById('cue-' + field);
            if (node && tags.indexOf('人脈卡隱藏::' + field) >= 0) cover(node);
        });

        var cue = document.getElementById('cue-work');
        if (!cue) return;
        var dd = document.getElementById('cue-work-text');
        // 與背面的 entryText 相同：職位是「公司・職稱」；格式壞掉時直接顯示原文
        var raw = (document.getElementById('front-company').textContent || '').trim();
        var items = null;
        try {
            items = JSON.parse(raw);
        } catch (e) {
            if (raw) dd.textContent = raw;  // 還沒轉換的舊文字：照原文當線索
            else cue.parentNode.removeChild(cue);
            return;
        }
        if (Object.prototype.toString.call(items) !== '[object Array]') items = [];
        var text = function (p) {
            return [p && p.company, p && p.title].map(function (s) { return String(s || '').trim(); })
                .filter(Boolean).join('・');
        };
        var named = items.filter(function (p) { return p && typeof p === 'object' && text(p); });
        var current = named.filter(function (p) { return !String(p.ended || '').trim() && !String(p.end || '').trim(); });
        var shown = current.length ? current : named.slice(-1);
        if (!shown.length) {
            cue.parentNode.removeChild(cue);
            return;
        }
        shown.forEach(function (p, i) {
            if (i > 0) dd.appendChild(document.createTextNode('／'));
            var span = document.createElement('span');
            span.textContent = text(p);
            if (p.hidden === true) cover(span, '隱藏');
            dd.appendChild(span);
        });
        if (!current.length) dd.appendChild(document.createTextNode('（以前）'));
    })();
</script>
