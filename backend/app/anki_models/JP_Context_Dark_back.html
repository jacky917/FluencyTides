{{FrontSide}}
<hr class="divider">
<div class="section" style="border-left-color: #2ecc71;">
    <div class="section-title" style="color: #2ecc71;">📖 情境對話 (Dialog)</div>
    <div id="chat-container" class="chat-container"></div>
</div>

<div id="dialog-data" style="display:none;">{{Dialog_JSON}}</div>
<script>
    (function() {
        var raw = (document.getElementById('dialog-data') || {}).textContent || '';
        var container = document.getElementById('chat-container');
        if (!container || !raw.trim()) return;

        var items = [];
        try { items = JSON.parse(raw.trim()); } catch (e) { 
            container.innerHTML = "<div style='color:red; font-size: 14px;'>JSON Parse Error: " + e.message + "<br><br>Raw Data:<br>" + raw + "</div>";
            return; 
        }

        items.forEach(function(item) {
            try {
                var isRight = item.align === 'right';
                var bubbleWrap = document.createElement('div');
                bubbleWrap.className = 'chat-bubble-wrap ' + (isRight ? 'chat-right' : 'chat-left');
                
                var avatarWrap = document.createElement('div');
                avatarWrap.className = 'avatar-btn';
                avatarWrap.style.margin = isRight ? '0 0 0 12px' : '0 12px 0 0';
                
                if (item.audio) {
                    var audio = document.createElement('audio');
                    audio.src = item.audio;
                    avatarWrap.appendChild(audio);
                    avatarWrap.onclick = function(e) {
                        if (e.target.tagName !== 'AUDIO') audio.play();
                    };
                    audio.onplay = function() { avatarWrap.classList.add('playing'); };
                    audio.onended = function() { avatarWrap.classList.remove('playing'); };
                } else {
                    avatarWrap.classList.add('no-audio');
                }

                var isNarration = !item.speaker || item.speaker.trim() === "-" || item.speaker.trim() === "";

                if (!isNarration) {
                    if (item.avatar && item.avatar !== 'none') {
                        var img = document.createElement('img');
                        img.src = item.avatar;
                        avatarWrap.appendChild(img);
                    } else {
                        var icon = document.createElement('div');
                        icon.className = 'avatar-icon';
                        icon.textContent = item.speaker ? item.speaker[0].toUpperCase() : '👤';
                        avatarWrap.appendChild(icon);
                    }
                }

                var bubble = document.createElement('div');
                bubble.className = 'chat-bubble ' + (item.is_target ? 'chat-target-bubble' : '');
                
                // 只有旁白 (無說話人) 時，對話框才使用最普通的底色（灰色），不套用左右分色
                if (isNarration) {
                    bubble.classList.add('chat-no-avatar');
                }
                
                var contentHtml = item.text || '';
                if (item.translation && item.translation !== "(翻譯遺失)") {
                    contentHtml += '<div class="chat-translation" style="color: #95a5a6; font-size: 0.85em; margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.15); line-height: 1.4;">' + item.translation + '</div>';
                }
                bubble.innerHTML = contentHtml;

                if (isNarration) {
                    bubbleWrap.style.justifyContent = 'center';
                    bubbleWrap.appendChild(bubble);
                } else {
                    if (isRight) {
                        bubbleWrap.appendChild(bubble);
                        bubbleWrap.appendChild(avatarWrap);
                    } else {
                        bubbleWrap.appendChild(avatarWrap);
                        bubbleWrap.appendChild(bubble);
                    }
                }
                container.appendChild(bubbleWrap);
            } catch (err) {
                var errDiv = document.createElement('div');
                errDiv.style.color = 'red';
                errDiv.textContent = 'Render Error: ' + err.message;
                container.appendChild(errDiv);
            }
        });
    })();
</script>
