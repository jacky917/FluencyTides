name: fluencytides-backend
services:
  backend:
    image: ghcr.io/jacky917/fluencytides-backend:latest
    container_name: fluencytides-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      
    # 密鑰掛載：啟動時從 NAS 主機讀取機密變數
    # 【部署】本檔由 Portainer 的 Git stack（fluencytides-backend）部署；Portainer 在自己的容器內
    # 執行 compose，所以 /DATA/AppData/FluencyTides 必須以相同路徑掛進 Portainer 才讀得到。
    # 【注意】env_file 只在「容器建立」時注入——修改 .env 後要到 Portainer 對 stack
    # 重新部署（Pull and redeploy），單純 restart 不會重讀。不要在 Portainer 之外用
    # docker compose 重建，會和 stack 搶管理權（見 docs/wip/portainer_gitops_deploy_FEAT_2026-10-20.md）。
    # 【claude-code 模式】該 .env 需設：LLM_PROVIDER=claude-code、
    # LLM_MODEL_NAME、LLM_CLAUDE_CODE_EFFORT、LLM_CLAUDE_CODE_OAUTH_TOKEN
    # （token 等同訂閱憑證，該檔請 chmod 600 並勿外流），
    # 詳見 docs/wip/claude_cli_in_container_FEAT_2026-08-29.md §5。
    env_file:
      - /DATA/AppData/FluencyTides/backend/.env
      
    # 保持原本的環境變數設定 (例如時區)
    environment:
      - TZ=Asia/Tokyo
      # 資料庫一律放在下方掛載的 /app/data，重建容器（每次部署都會重建）
      # 才不會遺失；compose 的 environment 優先於 env_file，
      # 主機 .env 裡的 DATABASE_URL 對容器不再生效。四個斜線＝容器內絕對路徑。
      # （2026-10-16 前預設的 ./fluencytides.db 會落在容器內的 /app，每次部署都被清空；
      # 舊資料搬移見模型路由計畫 llm_model_routing_FEAT_2026-10-15.md §9）
      - DATABASE_URL=sqlite+aiosqlite:////app/data/fluencytides.db

    volumes:
      # 將 SQLite 資料庫獨立放在一個資料夾中進行映射，避免覆蓋到容器內的程式碼
      - /DATA/AppData/FluencyTides/backend/data:/app/data
      # 映射日誌資料夾以利外部存取與分析
      - /DATA/AppData/FluencyTides/backend/logs:/app/logs
      
    # 明確指定加入自訂網路
    networks:
      - fluencytides_net
      
    x-casaos:
      ports:
        - container: "8000"
          description:
            en_US: API Port
            zh_CN: API 端口
      volumes:
        - container: /app/data
          description:
            en_US: Database Storage
            zh_CN: 資料庫儲存區
        - container: /app/logs
          description:
            en_US: Application Logs
            zh_CN: 應用程式日誌

# 【x-casaos 目前不生效】正式站改由 Portainer Git stack 部署（2026-10-20 起），CasaOS 讀不到
# Portainer 存放的 compose 檔，不會把這組容器列為自己的 app；CasaOS 主畫面改用「外部連結」
# 當入口（人工維護）。保留本區塊，供日後改回 CasaOS 管理時使用；Portainer 會忽略 x- 欄位。
x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: backend
  description:
    en_US: FluencyTides Backend Service running on FastAPI.
    zh_CN: FluencyTides 後端 API 服務 (FastAPI)，提供語言學習與 Telegram Bot 核心邏輯。
  store_app_id: fluencytides-backend
  title:
    en_US: FluencyTides API
    zh_CN: FluencyTides 後端
  icon: https://cdn.jsdelivr.net/gh/WalkxCode/dashboard-icons/png/fastapi.png
  # CasaOS 的「開啟」連結：經 Cloudflare Tunnel 對外的網域（tunnel 端 ft-backend.jacky917.com → http://localhost:8000）。
  # 後端 API 目前不驗證（API_SECRET_KEY 留空），此 hostname 務必在 Cloudflare Access 加上登入保護
  hostname: ft-backend.jacky917.com
  index: /docs
  port_map: "443"
  scheme: "https"

# 定義外部網路，指向後端建立的自訂網路 (fluencytides_net)
networks:
  fluencytides_net:
    external: true