name: elasticsearch-service
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.15
    container_name: elasticsearch
    networks:
      - fluencytides_net
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1536m -Xmx1536m
    ports:
      - "9200:9200"
    volumes:
      - /DATA/AppData/elasticsearch/data:/usr/share/elasticsearch/data
      - /DATA/AppData/elasticsearch/plugins:/usr/share/elasticsearch/plugins
    mem_limit: 3g
    command:
      - /bin/sh
      - -c
      - |
        rm -rf plugins/analysis-kuromoji
        if [ ! -d plugins/analysis-sudachi ]; then
          echo ">>> Downloading Sudachi..."
          bin/elasticsearch-plugin install --batch https://github.com/WorksApplications/elasticsearch-sudachi/releases/download/v3.6.0/elasticsearch-8.19.15-analysis-sudachi-3.6.0.zip
          
          echo ">>> Downloading Sudachi Core Dictionary..."
          mkdir -p config/sudachi
          curl -L -o /tmp/sudachi-dict.zip https://github.com/WorksApplications/SudachiDict/releases/download/v20260428/sudachi-dictionary-20260428-core.zip
          
          cd config/sudachi
          /usr/share/elasticsearch/jdk/bin/jar xf /tmp/sudachi-dict.zip
          mv sudachi-dictionary-*/system_core.dic .
          rm -rf sudachi-dictionary-*
          cd /usr/share/elasticsearch
          
          rm /tmp/sudachi-dict.zip
        fi
        exec /usr/local/bin/docker-entrypoint.sh eswrapper
x-casaos:
  architectures:
    - amd64
    - arm64
  main_app: elasticsearch
  author: "Expert Guide"
  category: "Database"
  description:
    en_us: "Elasticsearch 8.19.15 Core Engine with Sudachi Plugin"
    zh_cn: "Elasticsearch 8.19.15 核心資料庫 (自帶 Sudachi 日文分詞套件)"
  developer: "Elastic"
  icon: "https://cdn.iconscout.com/icon/free/png-256/elasticsearch-3628731-3030146.png"
  index: "/"
  port_map: "9200"
  title:
    en_us: "Elastic Engine"
networks:
  fluencytides_net:
    external: true
